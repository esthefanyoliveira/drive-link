<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Link — Passageiro</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="../shared/icons/icon-192.png" />
<link rel="apple-touch-icon" href="../shared/icons/icon-192.png" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="../shared/style.css" />
</head>
<body>

<div class="topo">
  <div class="marca">Drive<span>Link</span></div>
  <div id="usuarioNome"></div>
</div>

<div class="container">

  <!-- TELA: LOGIN / CADASTRO -->
  <div id="telaAuth" class="painel">
    <div id="formLogin">
      <h2>Entrar</h2>
      <label>E-mail</label>
      <input id="loginEmail" type="email" placeholder="voce@email.com" value="ana@teste.com" />
      <label>Senha</label>
      <input id="loginSenha" type="password" placeholder="••••••" value="senha123" />
      <button onclick="fazerLogin()">Entrar</button>
      <button class="secundario" onclick="mostrarCadastro()">Criar conta</button>
      <div id="erroLogin" class="erro"></div>
    </div>

    <div id="formCadastro" class="oculto">
      <h2>Criar conta</h2>
      <label>Nome completo</label>
      <input id="cadNome" />
      <label>Telefone</label>
      <input id="cadTelefone" />
      <label>E-mail</label>
      <input id="cadEmail" type="email" />
      <label>Senha</label>
      <input id="cadSenha" type="password" />
      <button onclick="fazerCadastro()">Cadastrar</button>
      <button class="secundario" onclick="mostrarLogin()">Já tenho conta</button>
      <div id="erroCadastro" class="erro"></div>
    </div>
  </div>

  <!-- TELA: SOLICITAR CORRIDA -->
  <div id="telaSolicitar" class="oculto">
    <div class="painel">
      <label>Endereço de origem</label>
      <div class="campo-busca">
        <input id="origemBusca" type="text" placeholder="Rua, número, bairro, cidade..." autocomplete="off" />
        <div id="sugestoesOrigem" class="sugestoes oculto"></div>
      </div>
      <label>Endereço de destino</label>
      <div class="campo-busca">
        <input id="destinoBusca" type="text" placeholder="Rua, número, bairro, cidade..." autocomplete="off" />
        <div id="sugestoesDestino" class="sugestoes oculto"></div>
      </div>
      <p style="color:var(--cinza);font-size:.8rem;margin:10px 0 8px;">
        Ou toque direto no mapa abaixo para marcar manualmente.
      </p>
      <div id="mapa"></div>
      <button class="secundario" onclick="limparPontos()">Limpar pontos</button>
    </div>
    <div class="painel" id="painelEstimativa" style="display:none">
      <div class="linha"><span>Distância</span><strong id="estDistancia">—</strong></div>
      <div class="linha"><span>Valor estimado</span><strong id="estValor">—</strong></div>
      <label>Forma de pagamento</label>
      <select id="formaPagamento">
        <option value="dinheiro">Dinheiro</option>
        <option value="pix">Pix</option>
      </select>
      <button onclick="solicitarCorrida()">Solicitar corrida</button>
    </div>
    <div class="painel">
      <button class="secundario" onclick="verHistorico()">Ver histórico de corridas</button>
      <button class="secundario" onclick="sair()">Sair</button>
    </div>
  </div>

  <!-- TELA: PROCURANDO MOTORISTA -->
  <div id="telaProcurando" class="oculto painel" style="text-align:center">
    <h2>Procurando motorista…</h2>
    <p style="color:var(--cinza)">Isso pode levar alguns instantes.</p>
    <button class="perigo" onclick="cancelarCorrida()">Cancelar solicitação</button>
  </div>

  <!-- TELA: ACOMPANHAMENTO -->
  <div id="telaAcompanhar" class="oculto">
    <div class="painel">
      <span class="badge status" id="statusCorrida">—</span>
      <div id="mapaAcompanhar" style="width:100%;height:260px;border-radius:12px;margin-top:12px;"></div>
    </div>
    <div class="painel" id="painelMotorista"></div>
    <div class="painel">
      <button class="perigo" id="btnCancelarCorrida" onclick="cancelarCorrida()">Cancelar corrida</button>
    </div>
  </div>

  <!-- TELA: AVALIAÇÃO -->
  <div id="telaAvaliar" class="oculto painel">
    <h2>Como foi sua corrida?</h2>
    <div class="linha"><span>Valor cobrado</span><strong id="valorFinalTexto">—</strong></div>
    <label>Nota</label>
    <div id="estrelasAvaliacao" style="display:flex;gap:8px;margin:4px 0 6px;"></div>
    <label>Comentário (opcional)</label>
    <input id="comentarioAvaliacao" placeholder="Conte como foi..." />
    <button onclick="enviarAvaliacao()">Enviar avaliação</button>
    <button class="secundario" onclick="voltarParaSolicitar()">Pular</button>
  </div>

  <!-- TELA: HISTÓRICO -->
  <div id="telaHistorico" class="oculto">
    <div class="painel" id="listaHistorico"><h2>Histórico</h2></div>
    <div class="painel"><button class="secundario" onclick="voltarParaSolicitar()">Voltar</button></div>
  </div>

</div>

<script src="../shared/config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="app.js"></script>
<script>
  // Registra o service worker, necessário para o navegador oferecer "instalar app".
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
