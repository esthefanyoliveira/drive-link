<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Link — Motorista</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="../shared/icons/icon-192.png" />
<link rel="apple-touch-icon" href="../shared/icons/icon-192.png" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="../shared/style.css" />
</head>
<body>

<div class="topo">
  <div class="marca">Drive<span>Link</span> Motorista</div>
  <div id="usuarioNome"></div>
</div>

<div class="container">

  <!-- LOGIN / CADASTRO -->
  <div id="telaAuth" class="painel">
    <div id="formLogin">
      <h2>Entrar</h2>
      <label>E-mail</label>
      <input id="loginEmail" type="email" value="motorista1@teste.com" />
      <label>Senha</label>
      <input id="loginSenha" type="password" value="senha123" />
      <button onclick="fazerLogin()">Entrar</button>
      <button class="secundario" onclick="mostrarCadastro()">Cadastrar como motorista</button>
      <div id="erroLogin" class="erro"></div>
    </div>

    <div id="formCadastro" class="oculto">
      <h2>Cadastro de motorista</h2>
      <label>Nome completo</label><input id="cadNome" />
      <label>Telefone</label><input id="cadTelefone" />
      <label>E-mail</label><input id="cadEmail" type="email" />
      <label>Senha</label><input id="cadSenha" type="password" />
      <label>CPF</label><input id="cadCpf" />
      <label>CNH</label><input id="cadCnh" />
      <label>Marca do veículo</label><input id="cadMarca" />
      <label>Modelo</label><input id="cadModelo" />
      <label>Cor</label><input id="cadCor" />
      <label>Placa</label><input id="cadPlaca" />
      <button onclick="fazerCadastro()">Cadastrar</button>
      <button class="secundario" onclick="mostrarLogin()">Já tenho conta</button>
      <div id="erroCadastro" class="erro"></div>
    </div>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="telaPainel" class="oculto">
    <div class="painel" style="display:flex;align-items:center;justify-content:space-between;">
      <span id="badgeOnline" class="badge offline">Offline</span>
      <button id="btnToggle" style="width:auto;margin:0;padding:10px 18px" onclick="alternarOnline()">Ficar online</button>
    </div>
    <div class="painel">
      <label>
        <input type="checkbox" id="usarLocalManual" onchange="$('camposLocalManual').classList.toggle('oculto', !this.checked)" />
        Usar localização manual (para testes fora da região, ou se o GPS falhar)
      </label>
      <div id="camposLocalManual" class="oculto">
        <label>Latitude</label>
        <input id="latManual" type="number" step="0.0001" placeholder="ex: -25.1500" />
        <label>Longitude</label>
        <input id="lngManual" type="number" step="0.0001" placeholder="ex: -49.7500" />
      </div>
    </div>
    <div id="painelAprovacao" class="painel oculto">
      <p style="color:var(--cinza)">Seu cadastro está pendente de aprovação pela administração.</p>
    </div>

    <div id="painelSolicitacao" class="painel card-destaque oculto">
      <h2>Nova corrida</h2>
      <div class="linha"><span>Origem</span><strong id="reqOrigem" style="text-align:right;max-width:65%;">—</strong></div>
      <div class="linha"><span>Destino</span><strong id="reqDestino" style="text-align:right;max-width:65%;">—</strong></div>
      <div class="linha"><span>Distância</span><strong id="reqDistancia">—</strong></div>
      <div class="linha"><span>Valor estimado</span><strong id="reqValor">—</strong></div>
      <button onclick="aceitarCorrida()">Aceitar corrida</button>
      <button class="secundario" onclick="recusarCorrida()">Ignorar</button>
    </div>

    <div id="painelCorridaAtiva" class="painel oculto">
      <span class="badge status" id="statusCorridaAtiva">—</span>
      <div id="mapaCorrida" style="width:100%;height:220px;border-radius:12px;margin:12px 0;"></div>
      <div id="infoPassageiro"></div>
      <button id="btnProximoStatus" onclick="avancarStatus()">—</button>
      <button class="perigo" onclick="cancelarCorridaAtiva()">Cancelar corrida</button>
    </div>

    <div class="painel" id="painelGanhos">
      <h2>Ganhos</h2>
      <div class="linha"><span>Corridas finalizadas</span><strong id="ganhoCorridas">—</strong></div>
      <div class="linha"><span>Total ganho</span><strong id="ganhoTotal">—</strong></div>
    </div>

    <div class="painel"><button class="secundario" onclick="sair()">Sair</button></div>
  </div>

</div>

<script src="../shared/config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
